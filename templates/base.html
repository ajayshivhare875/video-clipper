<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ClipKaro{% endblock %}</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #0f0f14; color: #eee; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 40px; }
  nav { display: flex; gap: 14px; align-items: center; padding: 12px 0; font-size: 14px; }
  nav a { color: #a99cff; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav .brand { font-weight: 800; font-size: 18px; color: #fff; margin-right: auto; }
  .card { background: #1a1a22; border-radius: 14px; padding: 20px; margin-top: 16px; }
  label { display: block; font-size: 13px; color: #aaa; margin: 12px 0 4px; }
  input[type=file], input[type=text], input[type=email], input[type=password], select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333;
    background: #111; color: #eee; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px;
    background: #6c5ce7; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: .5; }
  .btn.green { background: #00b894; }
  .err { color: #ff7675; font-size: 14px; margin-top: 10px; }
  .ok { color: #55efc4; font-size: 14px; margin-top: 10px; }
  .hint { font-size: 12px; color: #777; margin-top: 14px; }
  .plan { border: 1px solid #333; border-radius: 12px; padding: 16px; margin-top: 12px; }
  .plan.cur { border-color: #6c5ce7; }
  .plan h3 { margin: 0 0 6px; }
  .plan .price { font-size: 22px; font-weight: 700; }
  .plan ul { margin: 8px 0; padding-left: 18px; color: #bbb; font-size: 14px; }
  .badge { display: inline-block; background: #6c5ce7; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 20px; }
  .meter { height: 8px; background: #2a2a35; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .meter > div { height: 100%; background: #6c5ce7; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
  .check input { width: auto; }
  #status { margin-top: 14px; font-size: 14px; color: #bbb; min-height: 20px; }
  .clipitem { border: 1px solid #333; border-radius: 10px; padding: 12px; margin-top: 10px; }
  .clipitem .score { color: #fdcb6e; font-weight: 700; }
  .clipitem a { color: #55efc4; font-weight: 600; }
  .qr { text-align: center; } .qr img { width: 240px; border-radius: 10px; background: #fff; padding: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/">✂️ ClipKaro</a>
    {% if user %}
      <a href="/dashboard">Dashboard</a>
      <a href="/plans">Plans</a>
      <a href="/logout">Logout</a>
    {% else %}
      <a href="/plans">Pricing</a>
      <a href="/login">Login</a>
      <a href="/signup">Sign up</a>
    {% endif %}
  </nav>
  {% block body %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
